<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="How2Slide – Sessions voten und planen.">
  <meta name="theme-color" content="#0c0c0c">
  <title>How2Slide | Sessions</title>

  <style>
    :root {
      /* Farbschema der Freebord-Community-Seite */
      --black: #0c0c0c;
      --navy: #021e27;
      --charcoal: #1c1c1c;
      --red: #db4044;
      --blue: #0a7699;
      --white: #ffffff;
      --muted: #c7c7c7;
      --line: rgba(255, 255, 255, 0.16);
      --max: 1120px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 82px;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", Arial, sans-serif;
      line-height: 1.35;
    }

    body.modal-open { overflow: hidden; }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    a { color: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 3px;
    }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--line);
      background: var(--black);
    }

    .header-inner {
      position: relative;
      min-height: 82px;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .header-logo-link {
      position: relative;
      margin-left: auto;
      display: flex;
      align-items: center;
      align-self: stretch;
      padding-left: 30px;
      text-decoration: none;
    }

    .header-logo-link::before {
      position: absolute;
      top: 17px;
      bottom: 17px;
      left: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.18);
      content: "";
    }

    .header-logo-link::after {
      position: absolute;
      right: 0;
      bottom: 13px;
      width: 56%;
      height: 3px;
      background: var(--red);
      opacity: 0.9;
      content: "";
    }

    .logo {
      position: relative;
      z-index: 1;
      display: block;
      width: min(235px, 43vw);
      height: auto;
      mix-blend-mode: screen;
      filter: contrast(1.08) brightness(1.04);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav a {
      color: var(--white);
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav a:hover { color: var(--red); }

    .nav-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--white);
      cursor: pointer;
    }

    .nav-toggle svg { width: 24px; height: 24px; }

    main {
      min-height: 70vh;
      padding-bottom: 70px;
    }

    .intro {
      padding: 56px 0 26px;
    }

    .intro h1 {
      margin: 0;
      color: var(--red);
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .intro p {
      margin: 13px 0 0;
      color: var(--white);
      font-size: clamp(1.05rem, 2.5vw, 1.4rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    .section {
      padding: 42px 0;
    }

    .section-title {
      margin: 0 0 22px;
      color: var(--blue);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .sessions {
      display: grid;
      gap: 14px;
    }

    .session {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) auto;
      align-items: center;
      gap: 22px;
      min-height: 132px;
      padding: 22px;
      border-left: 7px solid var(--blue);
      background: var(--black);
    }

    .session[data-status="voting"] { border-left-color: var(--red); }
    .session[data-status="confirmed"] { border-left-color: var(--blue); }
    .session[data-status="planned"] { border-left-color: var(--white); }
    .session[data-status="cancelled"] {
      border-left-color: var(--red);
      opacity: 0.66;
    }

    .session-date {
      color: var(--white);
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .session-status {
      width: fit-content;
      margin-bottom: 9px;
      color: var(--red);
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .session[data-status="confirmed"] .session-status { color: var(--blue); }
    .session[data-status="planned"] .session-status { color: var(--white); }

    .session-details {
      color: var(--white);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .session-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }

    .btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: 2px solid transparent;
      border-radius: 0;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.035em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--red);
      color: var(--white);
    }

    .btn-primary:hover { background: #c93338; }

    .btn-secondary {
      border-color: var(--blue);
      background: transparent;
      color: var(--white);
    }

    .btn-secondary:hover { background: var(--blue); }

    .btn-dark {
      border-color: var(--white);
      background: transparent;
      color: var(--white);
    }

    .btn-dark:hover {
      background: var(--white);
      color: var(--black);
    }

    .calendar {
      border: 1px solid var(--line);
      background: var(--black);
    }

    .calendar-head {
      min-height: 72px;
      display: grid;
      grid-template-columns: 52px 1fr 104px;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }

    .calendar-head h3 {
      margin: 0;
      color: var(--red);
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
    }

    .calendar-buttons {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--charcoal);
      color: var(--white);
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .icon-btn svg { width: 21px; height: 21px; }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays {
      border-bottom: 1px solid var(--line);
      background: var(--charcoal);
    }

    .weekdays span {
      padding: 11px 4px;
      color: var(--white);
      font-size: 0.77rem;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
    }

    .weekdays span:nth-child(6),
    .weekdays span:nth-child(7) { color: var(--blue); }

    .calendar-grid {
      gap: 1px;
      background: var(--line);
    }

    .day {
      position: relative;
      min-width: 0;
      min-height: 90px;
      padding: 10px;
      border: 0;
      background: var(--black);
      color: var(--white);
      text-align: left;
    }

    button.day { cursor: pointer; }

    .day.outside {
      color: #686868;
      background: #111;
    }

    .day.weekend { background: var(--charcoal); }

    button.day.weekend:hover {
      box-shadow: inset 0 0 0 3px var(--blue);
    }

    .day.today { box-shadow: inset 0 0 0 2px var(--white); }

    .day.has-session::after {
      position: absolute;
      right: 9px;
      bottom: 9px;
      left: 9px;
      height: 6px;
      background: var(--blue);
      content: "";
    }

    .day.has-session.status-voting::after,
    .day.has-session.status-cancelled::after {
      background: var(--red);
    }

    .day-number {
      font-size: 1rem;
      font-weight: 900;
    }

    .day-label {
      display: block;
      margin-top: 12px;
      overflow: hidden;
      color: var(--white);
      font-size: 0.76rem;
      font-weight: 800;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 14px;
      color: var(--white);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend i {
      width: 15px;
      height: 5px;
      display: inline-block;
      background: var(--white);
    }

    .legend .vote { background: var(--red); }
    .legend .confirmed { background: var(--blue); }

    .outsider-note {
      margin-top: 46px;
      padding: 15px 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    .outsider-note a {
      color: var(--red);
      font-weight: 900;
      text-decoration: none;
    }

    .site-footer {
      position: relative;
      padding: 24px 0 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      background: var(--black);
    }

    .site-footer::before {
      position: absolute;
      top: 0;
      left: 0;
      width: min(230px, 40vw);
      height: 4px;
      background: var(--red);
      content: "";
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .footer-logo {
      display: block;
      width: 150px;
      height: auto;
      mix-blend-mode: screen;
      filter: contrast(1.05) brightness(1.02);
    }

    .footer-brand {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2px 0;
      background: var(--black);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.82);
    }

    .modal.open { display: flex; }

    .modal-box {
      position: relative;
      width: min(100%, 560px);
      max-height: 84vh;
      overflow-y: auto;
      border-top: 9px solid var(--blue);
      background: var(--charcoal);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
    }

    .modal-box.status-voting,
    .modal-box.status-cancelled {
      border-top-color: var(--red);
    }

    .modal-content { padding: 34px; }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      background: var(--black);
      color: var(--white);
      cursor: pointer;
    }

    .modal-close:hover { color: var(--red); }

    .modal-label {
      color: var(--red);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .modal-box.status-confirmed .modal-label { color: var(--blue); }

    .modal h2 {
      margin: 13px 50px 0 0;
      color: var(--white);
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 900;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .modal-info {
      display: grid;
      gap: 9px;
      margin: 25px 0;
      padding: 18px;
      background: var(--black);
    }

    .modal-info strong { color: var(--blue); }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 3000;
      max-width: calc(100% - 36px);
      padding: 13px 16px;
      border-left: 6px solid var(--red);
      background: var(--white);
      color: var(--black);
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: 150ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .nav-toggle {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .header-logo-link {
        margin-left: auto;
        padding-left: 18px;
      }

      .header-logo-link::before {
        top: 18px;
        bottom: 18px;
      }

      .header-logo-link::after {
        bottom: 10px;
        width: 50%;
      }

      .nav {
        position: absolute;
        top: 82px;
        right: 16px;
        left: 16px;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 8px;
        z-index: 20;
        border: 1px solid var(--line);
        background: var(--black);
      }

      .nav.open { display: flex; }
      .nav a { padding: 14px; }

      .session {
        grid-template-columns: 135px 1fr;
      }

      .session .actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .container { width: min(calc(100% - 20px), var(--max)); }

      .header-inner { min-height: 74px; }
      .logo { width: min(205px, 64vw); }
      .header-logo-link { align-self: stretch; }

      .intro { padding-top: 38px; }
      .intro h1 { font-size: clamp(2.7rem, 16vw, 4.2rem); }

      .section { padding: 32px 0; }

      .session {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 19px;
      }

      .session .actions { grid-column: auto; }
      .actions { justify-content: stretch; }
      .actions .btn { width: 100%; }

      .calendar-head {
        grid-template-columns: 46px 1fr 98px;
        padding-inline: 8px;
      }

      .day {
        min-height: 64px;
        padding: 7px;
      }

      .day-label { display: none; }
      .day.has-session::after { right: 6px; bottom: 6px; left: 6px; }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .footer-logo {
        width: 140px;
      }

      .modal-content { padding: 27px 22px; }
      .modal-actions { display: grid; }
      .modal-actions .btn { width: 100%; }
    }
  </style>
</head>

       formUrl:

       - bei "confirmed": Link zur Teilnahmeabfrage (Ab-/Zusage, Mitfahrbedarf usw.)

       Bei "planned" können finalDate, time und spot einzeln ergänzt werden.

       Nach dem Voting status auf "confirmed" setzen.
    */

    const JAMES_INSTAGRAM_URL = "https://www.instagram.com/how2slide_baden/";

    const sessions = [
      {

      {

        status: "planned",

      {

        mapsUrl: "https://maps.app.goo.gl/TTbnK77SSAwk4Rsp9"
      }
    ];

    const statusText = {
      voting: { label: "Voting läuft", detail: "Tag, Uhrzeit und Spot offen." },
      confirmed: { label: "Bestätigt", detail: "Termin steht fest. Teilnahme bitte eintragen." },
      planned: { label: "Geplant", detail: "Voting folgt." },
      cancelled: { label: "Abgesagt", detail: "Session fällt aus." },
      empty: { label: "Noch nichts geplant", detail: "Für dieses Wochenende ist nichts eingetragen." }
    };

    const today = startOfDay(new Date());
    let activeMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let previousFocus = null;
    let toastTimer = null;

    const sessionList = document.getElementById("sessionList");
    const calendarGrid = document.getElementById("calendarGrid");
    const calendarMonth = document.getElementById("calendarMonth");
    const modal = document.getElementById("modal");
    const modalBox = document.getElementById("modalBox");
    const modalContent = document.getElementById("modalContent");
    const modalClose = document.getElementById("modalClose");
    const toast = document.getElementById("toast");
    const nav = document.getElementById("nav");
    const navToggle = document.getElementById("navToggle");

    document.getElementById("year").textContent = new Date().getFullYear();

    function parseDate(value) {
      if (!value) return null;
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function dateKey(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function isPlaceholder(url) {
      return !url || url === "#" || url.includes("_HIER_EINFÜGEN") || !/^https?:\/\//i.test(url);
    }

    function openLink(url, message) {
      if (isPlaceholder(url)) {
        showToast(message);
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
    }

    function formatWeekend(session) {
      const start = parseDate(session.weekendStart);
      const end = parseDate(session.weekendEnd);
      const monthYear = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" }).format(end);

      if (start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear()) {
        return `${start.getDate()}.–${end.getDate()}. ${monthYear}`;
      }

      const startText = new Intl.DateTimeFormat("de-DE", { day: "numeric", month: "short" }).format(start);
      const endText = new Intl.DateTimeFormat("de-DE", { day: "numeric", month: "short", year: "numeric" }).format(end);
      return `${startText}–${endText}`;
    }

    function displayDate(session) {
      if ((session.status === "confirmed" || session.status === "planned") && session.finalDate) {
        return new Intl.DateTimeFormat("de-DE", {
          weekday: "short",
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(parseDate(session.finalDate));
      }
      return formatWeekend(session);
    }

    function missingPlannedDetails(session) {
      const missing = [];
      if (!session.finalDate) missing.push("Tag");
      if (!session.time) missing.push("Uhrzeit");
      if (!session.spot) missing.push("Spot");

      if (!missing.length) return "";
      if (missing.length === 1) return `${missing[0]} ist noch offen.`;

      const last = missing.pop();
      return `${missing.join(", ")} und ${last} sind noch offen.`;
    }

    function sessionForDate(date) {
      const key = dateKey(date);

      return sessions.find(item => {
        // Sobald bei einer geplanten oder bestätigten Session ein konkreter Tag
        // feststeht, wird sie im Kalender nur noch an diesem Tag angezeigt.
        if ((item.status === "planned" || item.status === "confirmed") && item.finalDate) {
          return key === item.finalDate;
        }

        // Solange kein genauer Tag feststeht, wird weiterhin das ganze Wochenende markiert.
        return key >= item.weekendStart && key <= item.weekendEnd;
      }) || null;
    }

    function upcomingSessions() {
      return [...sessions]
        .filter(item => parseDate(item.weekendEnd) >= today)
        .sort((a, b) => parseDate(a.weekendStart) - parseDate(b.weekendStart));
    }

    function renderSessions() {
      const upcoming = upcomingSessions();
      sessionList.innerHTML = "";

      if (!upcoming.length) {
        sessionList.innerHTML = '<div class="session">Keine Sessions eingetragen.</div>';
        return;
      }

      upcoming.forEach(session => {
        const article = document.createElement("article");
        article.className = "session";
        article.dataset.status = session.status;

        let detail = statusText[session.status].detail;
        let sub = "";

        if (session.status === "voting") {
          detail = "";
          sub = statusText.voting.detail;
        }

        if (session.status === "confirmed") {
          detail = [session.time, session.spot].filter(Boolean).join(" · ") || detail;
          if (session.formUrl) {
            sub = "Ab-/Zusage und Mitfahrbedarf eintragen.";
          }
        }

        if (session.status === "planned") {
          const knownDetails = [session.time, session.spot].filter(Boolean);
          detail = knownDetails.length ? knownDetails.join(" · ") : statusText.planned.detail;
          sub = missingPlannedDetails(session);
        }

        let actionButtons = "";

        if (session.status === "voting") {
          actionButtons = '<button class="btn btn-primary session-form" type="button">Voten</button>';
        } else if (session.status === "planned") {
          actionButtons = session.formUrl
            ? '<button class="btn btn-primary session-form" type="button">Voten</button>'
            : "";
        } else if (session.status === "confirmed" && session.formUrl) {
          actionButtons = '<button class="btn btn-primary session-form" type="button">Ab-/Zusage?</button>';
        } else {
          actionButtons = '<button class="btn btn-secondary details" type="button">Details</button>';
        }

        const mapsButton = session.status === "confirmed" && session.mapsUrl
          ? '<button class="btn btn-dark maps" type="button">Route</button>'
          : "";

        article.innerHTML = `
          <div class="session-date">${escapeHtml(displayDate(session))}</div>
          <div>
            <div class="session-status">${escapeHtml(statusText[session.status].label)}</div>
            ${detail ? `<div class="session-details">${escapeHtml(detail)}</div>` : ""}
            ${sub ? `<div class="session-sub">${escapeHtml(sub)}</div>` : ""}
          </div>
          <div class="actions">
            ${actionButtons}
            ${mapsButton}
          </div>
        `;

        article.querySelector(".details")?.addEventListener("click", () => openSession(session));
        article.querySelector(".session-form")?.addEventListener("click", () =>
          openLink(
            session.formUrl,
            session.status === "confirmed"
              ? "Link zur Teilnahmeabfrage im Code eintragen."
              : "Voting-Link im Code eintragen."
          )
        );
        article.querySelector(".maps")?.addEventListener("click", () =>
          openLink(session.mapsUrl, "Maps-Link im Code eintragen.")
        );

        sessionList.appendChild(article);
      });
    }

    function renderCalendar() {
      calendarGrid.innerHTML = "";
      calendarMonth.textContent = new Intl.DateTimeFormat("de-DE", {
        month: "long",
        year: "numeric"
      }).format(activeMonth);

      const first = new Date(activeMonth.getFullYear(), activeMonth.getMonth(), 1);
      const mondayIndex = (first.getDay() + 6) % 7;
      const start = addDays(first, -mondayIndex);

      for (let index = 0; index < 42; index += 1) {
        const date = addDays(start, index);
        const outside = date.getMonth() !== activeMonth.getMonth();
        const weekend = date.getDay() === 0 || date.getDay() === 6;
        const isToday = dateKey(date) === dateKey(today);
        const session = sessionForDate(date);

        const cell = document.createElement(weekend ? "button" : "div");
        cell.className = [
          "day",
          outside ? "outside" : "",
          weekend ? "weekend" : "",
          isToday ? "today" : "",
          session ? `has-session status-${session.status}` : ""
        ].filter(Boolean).join(" ");

        cell.setAttribute("role", "gridcell");

        if (weekend) {
          cell.type = "button";
          cell.setAttribute("aria-label", `${date.toLocaleDateString("de-DE")}: Details`);
          cell.addEventListener("click", () => openDate(date));
        }

        const label = session
          ? session.spot || statusText[session.status].label
          : "";

        cell.innerHTML = `
          <span class="day-number">${date.getDate()}</span>
          ${label ? `<span class="day-label">${escapeHtml(label)}</span>` : ""}
        `;

        calendarGrid.appendChild(cell);
      }
    }

    function openDate(date) {
      const session = sessionForDate(date);
      if (session) {
        openSession(session);
        return;
      }

      const start = date.getDay() === 0 ? addDays(date, -1) : date;
      const end = addDays(start, 1);

      modalBox.className = "modal-box";
      modalContent.innerHTML = `
        <div class="modal-label">${statusText.empty.label}</div>
        <h2 id="modalTitle">${start.getDate()}.–${end.getDate()}. ${
          new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" }).format(end)
        }</h2>
        <div class="modal-info">${statusText.empty.detail}</div>
        <div class="modal-actions">
          <button class="btn btn-dark close-modal" type="button">Schließen</button>
        </div>
      `;

      modalContent.querySelector(".close-modal").addEventListener("click", closeModal);
      openModal();
    }

    function openSession(session) {
      modalBox.className = `modal-box status-${session.status}`;

      const rows = [];
      rows.push(`<div><strong>Termin:</strong> ${escapeHtml(displayDate(session))}</div>`);
      if (session.time) rows.push(`<div><strong>Uhrzeit:</strong> ${escapeHtml(session.time)}</div>`);
      if (session.spot) rows.push(`<div><strong>Spot:</strong> ${escapeHtml(session.spot)}</div>`);
      if (session.status === "planned") {
        const missing = missingPlannedDetails(session);
        if (missing) rows.push(`<div><strong>Noch offen:</strong> ${escapeHtml(missing)}</div>`);
      }

      const formButton = (session.status === "voting" || session.status === "planned") && session.formUrl
        ? '<button class="btn btn-primary modal-form" type="button">Voten</button>'
        : session.status === "confirmed" && session.formUrl
          ? '<button class="btn btn-primary modal-form" type="button">Ab-/Zusage?</button>'
          : "";

      const mapsButton = session.status === "confirmed" && session.mapsUrl
        ? '<button class="btn btn-secondary modal-maps" type="button">Route</button>'
        : "";

      modalContent.innerHTML = `
        <div class="modal-label">${escapeHtml(statusText[session.status].label)}</div>
        <h2 id="modalTitle">${escapeHtml(displayDate(session))}</h2>
        <div class="modal-info">${rows.join("")}</div>
        <div class="modal-actions">
          ${formButton}
          ${mapsButton}
          <button class="btn btn-dark close-modal" type="button">Schließen</button>
        </div>
      `;

      modalContent.querySelector(".modal-form")?.addEventListener("click", () =>
        openLink(
          session.formUrl,
          session.status === "confirmed"
            ? "Link zur Teilnahmeabfrage im Code eintragen."
            : "Voting-Link im Code eintragen."
        )
      );
      modalContent.querySelector(".modal-maps")?.addEventListener("click", () =>
        openLink(session.mapsUrl, "Maps-Link im Code eintragen.")
      );
      modalContent.querySelector(".close-modal").addEventListener("click", closeModal);

      openModal();
    }

    function openModal() {
      previousFocus = document.activeElement;
      modal.classList.add("open");
      document.body.classList.add("modal-open");
      modalClose.focus();
    }

    function closeModal() {
      modal.classList.remove("open");
      document.body.classList.remove("modal-open");
      previousFocus?.focus?.();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      activeMonth = new Date(activeMonth.getFullYear(), activeMonth.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      activeMonth = new Date(activeMonth.getFullYear(), activeMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("todayMonth").addEventListener("click", () => {
      activeMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      renderCalendar();
    });

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    navToggle.addEventListener("click", () => {
      const open = nav.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", String(open));
    });

    nav.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        nav.classList.remove("open");
        navToggle.setAttribute("aria-expanded", "false");
      });
    });

    document.querySelectorAll(".smart-instagram").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        openLink(JAMES_INSTAGRAM_URL, "James’ Instagram-Link im Code eintragen.");
      });
    });

    renderSessions();
    renderCalendar();
  </script>
</body>
</html>
